<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>260705 주일예배</title>
<meta property="og:title" content="260705 주일예배">
<meta property="og:description" content="260705 주일예배 · 성찬">
<meta property="og:image" content="https://raw.githubusercontent.com/smart9592/reframechurch/refs/heads/main/image.png">
<meta property="og:type" content="website">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { font-size: 100%; }
  body { font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; background: #fdf5f4; color: #1a0808; min-height: 100vh; }

  .hero { background: #fff; padding: 3rem 1.5rem 2.5rem; text-align: center; border-bottom: 2px solid #8B1A1A; }
  .title { font-size: 2.2rem; font-weight: 700; color: #1a0808; margin-bottom: 0.4rem; line-height: 1.3; }
  .subtitle { font-size: 0.85rem; color: #a06060; letter-spacing: 0.08em; }

  .content { max-width: 600px; margin: 0 auto; padding: 1.2rem 0.6rem; }

  .section { background: #fff; border-radius: 16px; padding: 1.2rem 1.2rem 0.5rem; margin-bottom: 1.2rem; box-shadow: 0 2px 12px rgba(139,26,26,0.08); border: 1px solid rgba(139,26,26,0.12); }
  .section-header { display: flex; align-items: center; gap: 0.7rem; margin-bottom: 1rem; padding-bottom: 0.75rem; border-bottom: 1.5px solid #fce8e8; }
  .section-badge { background: #6B1515; color: #fff; font-size: 0.72rem; font-weight: 700; padding: 3px 10px; border-radius: 20px; letter-spacing: 0.05em; flex-shrink: 0; }
  .section-title { font-size: 1rem; font-weight: 700; color: #1a0808; }

  .order-item { display: grid; grid-template-columns: 1fr auto; gap: 0.5rem; padding: 0.7rem 0; border-bottom: 1px solid #fdf0f0; align-items: start; }
  .order-item:last-child { border-bottom: none; }
  .item-left { display: flex; flex-direction: column; gap: 0.2rem; }
  .item-name { font-size: 0.92rem; font-weight: 600; color: #1a0808; }
  .item-detail { font-size: 0.8rem; color: #7a4040; line-height: 1.6; }
  .item-right { text-align: right; }
  .item-who { font-size: 0.8rem; color: #1a0808; font-weight: 500; white-space: nowrap; }
  .note { font-size: 0.74rem; color: #b07070; font-style: italic; margin-top: 0.2rem; }

  .song-btn { background: none; border: none; color: #8B1A1A; font-size: 0.8rem; font-family: inherit; cursor: pointer; padding: 2px 0; text-align: left; display: flex; align-items: center; gap: 4px; transition: color 0.2s; line-height: 1.7; }
  .song-btn:hover { color: #5A0F0F; text-decoration: underline; }
  .song-btn::before { content: '♪'; font-size: 0.72rem; }
  .text-btn { background: none; border: none; color: #6b7280; font-size: 0.8rem; font-family: inherit; cursor: pointer; padding: 2px 0; text-align: left; display: flex; align-items: center; gap: 4px; transition: color 0.2s; line-height: 1.7; }
  .text-btn:hover { color: #374151; text-decoration: underline; }
  .text-btn::before { content: '💬'; font-size: 0.72rem; }

  .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 100; align-items: center; justify-content: center; padding: 1.5rem; }
  .overlay.active { display: flex; }
  .popup { background: #fff; border-radius: 20px; width: 100%; max-width: 420px; max-height: 82vh; display: flex; flex-direction: column; box-shadow: 0 20px 60px rgba(0,0,0,0.2); }
  .popup-header { display: flex; align-items: center; justify-content: space-between; padding: 1rem 1.2rem; border-bottom: 1px solid #fce8e8; gap: 0.5rem; }
  .popup-badge { font-size: 0.68rem; font-weight: 700; color: #fff; padding: 3px 8px; border-radius: 20px; flex-shrink: 0; }
  .popup-badge.song { background: #8B1A1A; }
  .popup-badge.text { background: #6b7280; }
  .popup-title { font-size: 0.95rem; font-weight: 700; color: #1a0808; flex: 1; }
  .popup-close { background: #fce8e8; border: none; color: #8B1A1A; width: 28px; height: 28px; border-radius: 50%; font-size: 1.1rem; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .popup-close:hover { background: #f5d5d5; }
  .popup-body { padding: 1.2rem; overflow-y: auto; }
  .popup-legend { display: flex; gap: 1.2rem; margin-bottom: 0.7rem; }
  .popup-legend span { font-size: 0.75rem; color: #6b7280; }
  .popup-legend .icon-t { color: #8B4545; font-weight: 700; }
  .popup-legend .icon-c { color: #8B1A1A; font-weight: 700; }
  .popup-divider { border: none; border-top: 1px solid #fce8e8; margin-bottom: 1rem; }
  .popup-text { font-size: 0.88rem; color: #374151; line-height: 2.1; white-space: pre-wrap; word-break: keep-all; }
</style>
</head>
<body>

<div class="hero">
  <div style="margin-bottom: 0.6rem;">
    <img src="https://raw.githubusercontent.com/smart9592/reframechurch/refs/heads/main/1688777944179.png" alt="리프레임처치" style="width: 200px; max-width: 70%; filter: brightness(0);" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
    <div style="display:none; font-size:1.4rem; font-weight:700; letter-spacing:0.08em; color:#1a0808;">리프레임처치</div>
  </div>
  <div class="title">260705 주일예배</div>
  <div class="subtitle">성찬</div>
</div>

<div class="content">

  <!-- 성찬 -->
  <div class="section">
    <div class="section-header">
      <div class="section-badge">성찬</div>
      <div class="section-title">성찬으로 나아갑니다</div>
    </div>
    <div class="order-item">
      <div class="item-left">
        <div class="item-name">성찬으로의 초대</div>
        <div class="item-detail"><button class="text-btn" onclick="openPopup('text','성찬으로의 초대',true)">성찬으로의 초대 보기</button></div>
        <div class="note">* 교독문 후, 모든 성도들은 성찬 식탁 앞으로 나옵니다.</div>
      </div>
      <div class="item-right"><div class="item-who">다같이</div></div>
    </div>
    <div class="order-item">
      <div class="item-left">
        <div class="item-name">성찬 찬양</div>
        <div class="item-detail"><button class="song-btn" onclick="openPopup('song','성부 성자 성령',false)">성부 성자 성령</button></div>
      </div>
      <div class="item-right"><div class="item-who">다같이</div></div>
    </div>
    <div class="order-item">
      <div class="item-left">
        <div class="item-name">성찬 제정사</div>
        <div class="item-detail"><button class="text-btn" onclick="openPopup('text','성찬 제정사',true)">성찬 제정사 보기</button></div>
      </div>
      <div class="item-right"><div class="item-who">다같이</div></div>
    </div>
    <div class="order-item">
      <div class="item-left"><div class="item-name">성찬 기도</div></div>
      <div class="item-right"><div class="item-who">집례자</div></div>
    </div>
    <div class="order-item">
      <div class="item-left">
        <div class="item-name">성찬 찬양</div>
        <div class="item-detail"><button class="song-btn" onclick="openPopup('song','주의 보좌로 나아갈 때에',false)">주의 보좌로 나아갈 때에</button></div>
      </div>
      <div class="item-right"><div class="item-who">다같이</div></div>
    </div>
    <div class="order-item">
      <div class="item-left">
        <div class="item-name">분병 분잔</div>
        <div class="item-detail"><button class="text-btn" onclick="openPopup('text','분병 분잔',true)">분병 분잔 보기</button></div>
        <div class="note">* 찬양팀부터 나와서 성찬에 참여합니다.</div>
      </div>
      <div class="item-right"><div class="item-who">다같이</div></div>
    </div>
    <div class="order-item">
      <div class="item-left"><div class="item-name">성찬 후 감사기도</div></div>
      <div class="item-right"><div class="item-who">집례자</div></div>
    </div>
    <div class="order-item">
      <div class="item-left">
        <div class="item-name">응답 찬양</div>
        <div class="item-detail"><button class="song-btn" onclick="openPopup('song','성부 성자 성령 후렴',false)">성부 성자 성령 (후렴)</button></div>
      </div>
      <div class="item-right"><div class="item-who">다같이</div></div>
    </div>
  </div>

</div>

<div class="overlay" id="overlay" onclick="closeOnOverlay(event)">
  <div class="popup">
    <div class="popup-header">
      <div style="display:flex;align-items:center;gap:0.4rem;flex:1;min-width:0;">
        <span class="popup-badge" id="popup-badge"></span>
        <span class="popup-title" id="popup-title-text"></span>
      </div>
      <button class="popup-close" onclick="closePopup()">×</button>
    </div>
    <div class="popup-body">
      <div id="popup-legend-area"></div>
      <div class="popup-text" id="popup-content"></div>
    </div>
  </div>
</div>

<script>
const badgeLabels = { song: '찬양', text: '내용' };
const LEGEND = `<div class="popup-legend"><span><span class="icon-t">†</span> 인도자</span><span><span class="icon-c">✦</span> 성도들</span></div><hr class="popup-divider">`;

const data = {
  '성찬으로의 초대': `† 주님께서 베푸신 환대의 식탁에 성도들을 초대합니다.\n✦ 감사함으로 주님 앞에 나아갑니다.\n† 주님께서 여러분들과 함께 하시기를 빕니다.\n✦ 목사님과 함께 하기를 빕니다.\n† 주님을 향해 마음을 드높이십시오.\n✦ 우리 마음을 주님께 높이 듭니다.\n† 우리 주 하나님께 감사합시다.\n✦ 이는 주님의 백성이 마땅히 해야 할 바입니다.`,

  '성부 성자 성령': `성부 성자 성령 하나님 우리게 오소서(반복)\n나의 하나님 나의 예수님 능력의 주 성령\n성부 성자 성령 하나님 우리게 오소서(반복)`,

  '성찬 제정사': `† (말씀 봉독 후) 이것은 주님께 전해 받은 것입니다.\n✦ 주 예수님, 우리가 먹고 마실 때마다 우리를 위해 찢기시고, 흘리시고, 나누어 주신 그 사랑과 은혜를 기억합니다.`,

  '주의 보좌로 나아갈 때에': `주의 보좌로 나아갈때에 어떻게 나가야할까\n나를 구원한 주의 십자가 그것을 믿으며 가네\n주의 보좌로 나아갈때에 나 여전히 부족하나\n나를 부르신 주의 그 사랑 그것을 믿으며 가네\n자격없는 내 힘이 아닌 오직 예수님의 보혈로\n자격없는 내 힘이 아닌 오직 예수님의 보혈로\n십자가의 보혈 완전하신 사랑 힘 입어 나아갑니다\n십자가의 보혈 완전하신 사랑 힘 입어 예배합니다`,

  '분병 분잔': `† 이것은 그리스도의 몸입니다.\n✦ 아멘.\n† 이것은 그리스도의 피입니다.\n✦ 아멘.`,

  '성부 성자 성령 후렴': `아멘 아멘 아멘 아멘(반복)`
};

function openPopup(type, title, showLegend) {
  const badge = document.getElementById('popup-badge');
  badge.className = 'popup-badge ' + type;
  badge.textContent = badgeLabels[type] || '';
  document.getElementById('popup-title-text').textContent = title;
  document.getElementById('popup-legend-area').innerHTML = showLegend ? LEGEND : '';
  const content = data[title];
  document.getElementById('popup-content').textContent =
    (content !== undefined && content !== '') ? content : '내용을 입력해 주세요.';
  document.getElementById('overlay').classList.add('active');
}
function closePopup() { document.getElementById('overlay').classList.remove('active'); }
function closeOnOverlay(e) { if (e.target === document.getElementById('overlay')) closePopup(); }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closePopup(); });
</script>
</body>
</html>
